services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ROADCLEAR_DEVICE: cpu
      ROADCLEAR_MODEL_DIR: /app/models
      ROADCLEAR_DATA_DIR: /app/runtime
      ROADCLEAR_MAX_UPLOAD_MB: ${ROADCLEAR_MAX_UPLOAD_MB:-100}
      ROADCLEAR_DISABLED_MODELS: ${ROADCLEAR_DISABLED_MODELS:-}
      ROADCLEAR_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./models:/app/models:ro
      - ./runtime:/app/runtime
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 5s
      start_period: 90s
      retries: 3
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped
